<ul class="book-card-container">
    <li *ngFor="let book of (books$ | async)" (click)="showBook(book)" [attr.data-cy]="'book-card-' + book.id">
        <h2>{{ book.title }}</h2>
        <img class="book-card-img" [src]="'http://covers.openlibrary.org/b/isbn/' + book.isbn + '-S.jpg'" />
        <h3>{{ book.author }}</h3>
    </li>
</ul>

<button (click)="newBook()" class="floating-button" data-cy="add-book-button">
  Add a new book
</button>
